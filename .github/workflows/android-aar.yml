name: Build Android AAR

on:
  workflow_dispatch:
    inputs:
      skip_legacy:
        description: 'Skip building libbox-legacy.aar (faster)'
        type: boolean
        default: false
      create_release:
        description: 'Publish AAR to GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (required if publishing to release)'
        type: string
        default: ''
  push:
    tags:
      - 'v*'
      - 'android-*'

jobs:
  build:
    name: Build libbox.aar
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Install gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build AAR
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          SKIP_JAVA_CHECK: "1"
        run: |
          BUILD_ARGS=""
          if [ "${{ inputs.skip_legacy }}" = "true" ]; then
            BUILD_ARGS="-skip-legacy"
          fi
          bash scripts/build_aar.sh $BUILD_ARGS

      - name: Inspect AAR & SO Sizes
        run: |
          echo "=== AAR 文件列表与大小 ==="
          ls -lh libbox*.aar
          echo "=== libbox.aar 内部 so 详情 ==="
          unzip -l libbox.aar | grep -E "libbox.so" || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: libbox-aar
          path: libbox*.aar

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (inputs.create_release && inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.release_tag }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "Target Tag: $TAG_NAME"
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME exists, uploading assets..."
            gh release upload "$TAG_NAME" libbox*.aar --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" libbox*.aar --title "$TAG_NAME" --notes "Automated build of libbox.aar with trimmed tags and stripped symbols."
          fi
