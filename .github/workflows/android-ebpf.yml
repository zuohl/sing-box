name: Build Android eBPF

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - goarch: arm64
            compiler: aarch64-linux-android35-clang
          - goarch: arm
            goarm: "7"
            compiler: armv7a-linux-androideabi35-clang
          - goarch: amd64
            compiler: x86_64-linux-android35-clang
          - goarch: "386"
            compiler: i686-linux-android35-clang
    env:
      BASE_TAGS: with_quic,with_dhcp,with_utls,with_clash_api,with_ebpf,badlinkname,tfogo_checklinkname0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.compiler }}
        run: |
          export TAGS="$BASE_TAGS"
          make build

      - name: Run eBPF control-plane tests
        if: matrix.target.goarch == 'arm64'
        run: go test -tags with_ebpf ./protocol/ebpf ./common/dialer ./daemon

      - name: Android smoke instructions
        if: matrix.target.goarch == 'arm64'
        run: |
          cat <<'EOF'
          This workflow validates the Android eBPF build and control-plane tests.
          A privileged device run is intentionally manual: use an ADB-root runner,
          push the arm64 binary to /data/local/tmp/sing-box, start a minimal cgroup
          and TC configuration, then collect `tools ebpf status --json` and logcat.
          Do not treat this build job as proof that a vendor kernel can attach eBPF.
          EOF

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-android-${{ matrix.target.goarch }}-with-ebpf
          path: sing-box

      - name: Send arm64 eBPF binary to Telegram
        if: ${{ matrix.target.goarch == 'arm64' }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_MAX_DOCUMENT_BYTES: ${{ vars.TELEGRAM_MAX_DOCUMENT_BYTES }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing, skipping upload."
            exit 0
          fi

          output_name="sing-box-android-arm64-with-ebpf"
          cp sing-box "${output_name}"
          tar -czf "${output_name}.tar.gz" "${output_name}"

          max_document_bytes="${TELEGRAM_MAX_DOCUMENT_BYTES:-52428800}"
          doc_path="${output_name}.tar.gz"
          doc_size="$(stat -c '%s' "$doc_path")"
          if [ "$doc_size" -gt "$max_document_bytes" ]; then
            echo "::warning::Skipping Telegram upload because file is $doc_size bytes, above $max_document_bytes limit."
            exit 0
          fi

          commit_id="$(git rev-parse HEAD)"
          commit_short_id="$(git rev-parse --short=12 HEAD)"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$commit_id"
          workflow_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_message="$(git log -1 --pretty=%B)"
          commit_message="${commit_message//$'\r'/}"
          if [ -z "${commit_message//[[:space:]]/}" ]; then
            commit_message="(empty commit message)"
          fi
          if [ "${#commit_message}" -gt 650 ]; then
            commit_message="${commit_message:0:650}"$'\n...'
          fi
          commit_message_html="$(printf '%s' "$commit_message" | python3 -c 'import html, sys; print(html.escape(sys.stdin.read(), quote=False), end="")')"

          caption="$(printf 'sing-box (Android eBPF)\n\n%s\n\n%s\n<a href="%s">Commit</a> | <a href="%s">Workflow run</a>' \
            "$commit_message_html" \
            "$commit_short_id" \
            "$commit_url" \
            "$workflow_run_url")"

          echo "Uploading ${doc_path} to Telegram"
          args=(
            --fail-with-body
            -sS
            -X POST
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
            --form-string "chat_id=${TELEGRAM_CHAT_ID}"
            --form "document=@${doc_path};filename=${doc_path}"
            --form-string "caption=${caption}"
            --form-string "parse_mode=HTML"
          )

          if [ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]; then
            args+=(--form-string "message_thread_id=${TELEGRAM_MESSAGE_THREAD_ID}")
          fi

          curl "${args[@]}"
